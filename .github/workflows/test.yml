name: Test

on: [ push, pull_request ]

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
    - uses: cachix/install-nix-action@v31.10.7
    - uses: cachix/cachix-action@v17
      with:
        name: guibou
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build all
      run: nix-build all.nix
